aid: metrobi
name: Metrobi
description: >-
  Metrobi is a Boston-based local same-day delivery and courier platform for
  businesses — bakeries, caterers, florists, coffee roasters, meal-prep and
  wholesale food & beverage makers — covering the top 18 US metropolitan areas.
  Its fulfillment platform handles delivery management, route optimization,
  receiver notifications, live tracking and driver dispatch across a network of
  contractor drivers, plus tools for teams running their own in-house drivers.
  The Metrobi Delivery API lets platforms programmatically estimate, create,
  read, list and cancel local deliveries and receive real-time status updates
  via per-delivery webhooks.
